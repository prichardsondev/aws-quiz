<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Service Quiz</title>
    <link rel="stylesheet" href="./css/index.css">
<link rel="stylesheet" href="./css/game.css" />
<link rel="stylesheet" href="./css/highscores.css" />
</head>
<body>
    <main class="container">
        <div id="home" class="flex-center flex-column">
            <h1>AWS Service Quiz</h1>
            <p class="summary">Choose a category, practise, then review the answers you missed.</p>
            <form id="startForm" class="setup">
                <label class="label" for="catagories">Category</label>
                <select name="catagories" id="catagories" disabled>
                    <option>Loading…</option>
                </select>
                <label class="label" for="quizLength">Questions</label>
                <select name="quizLength" id="quizLength">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="all">All</option>
                </select>
                <p id="loadError" class="error hidden" role="alert">
                    Couldn't load categories.
                    <button type="button" class="link-btn" id="retryCategories">Try again</button>
                </p>
                <button type="submit" class="btn btn-primary" id="playBtn" disabled>Play</button>
            </form>
            <a class="btn" href="./highscores.html">High Scores</a>
        </div>
    </main>
    <script src="./js/common.js"></script>

</body>
</html>
