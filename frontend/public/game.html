<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play – AWS Service Quiz</title>
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="stylesheet" href="./css/game.css" />
  </head>
  <body>
    <main class="container">
      <div id="loader" role="status" aria-label="Loading questions"></div>

      <div id="loadError" class="flex-center flex-column hidden" role="alert">
        <h2 class="error-title">Couldn't load questions</h2>
        <p class="error" id="loadErrorText"></p>
        <button type="button" class="btn btn-primary" id="retryLoad">Try again</button>
        <a class="btn" href="/">Go Home</a>
      </div>

      <div id="game" class="justify-center flex-column hidden">
        <div id="hud">
          <div class="hud-item">
            <p class="hud-prefix">Question</p>
            <p class="hud-main-text" id="questionCounter" aria-live="polite"></p>
          </div>
          <div class="hud-item">
            <p class="hud-prefix">Category</p>
            <p class="hud-main-text" id="catagory"></p>
          </div>
          <div class="hud-item">
            <p class="hud-prefix">Correct</p>
            <p class="hud-main-text" id="score">0</p>
          </div>
        </div>
        <div class="progress" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>

        <h2 id="question" tabindex="-1"></h2>
        <div id="choices" class="choices" role="group" aria-labelledby="question">
          <button type="button" class="choice-container" data-number="1">
            <span class="choice-prefix">A</span><span class="choice-text"></span><span class="choice-mark" aria-hidden="true"></span>
          </button>
          <button type="button" class="choice-container" data-number="2">
            <span class="choice-prefix">B</span><span class="choice-text"></span><span class="choice-mark" aria-hidden="true"></span>
          </button>
          <button type="button" class="choice-container" data-number="3">
            <span class="choice-prefix">C</span><span class="choice-text"></span><span class="choice-mark" aria-hidden="true"></span>
          </button>
          <button type="button" class="choice-container" data-number="4">
            <span class="choice-prefix">D</span><span class="choice-text"></span><span class="choice-mark" aria-hidden="true"></span>
          </button>
        </div>

        <div class="feedback-row">
          <p id="feedback" class="feedback" aria-live="polite"></p>
          <button type="button" class="btn btn-primary hidden" id="nextBtn">Next</button>
        </div>
        <p class="hint">Tip: press 1–4 or A–D to answer, Enter for next.</p>
      </div>
    </main>
    <script src="./js/common.js"></script>
    <script src="./js/game.js"></script>
  </body>
</html>
