<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Results – AWS Service Quiz</title>
    <link rel="stylesheet" href="./css/index.css" />
  <link rel="stylesheet" href="./css/game.css" />
<link rel="stylesheet" href="./css/highscores.css" />
</head>
  <body>
    <main class="container" id="container">
      <div id="end" class="flex-center flex-column">
        <h1 id="finalScore"></h1>
        <p class="summary" id="summary"></p>
        <form id="saveForm">
          <label class="label" for="username">Name for the high score list</label>
          <input type="text" name="username" id="username" maxlength="20" autocomplete="nickname" />
          <button type="submit" class="btn btn-primary" id="saveScoreBtn" disabled>Save score</button>
        </form>
        <button type="button" class="btn" id="reviewBtn">Review answers</button>
        <button type="button" class="btn hidden" id="retryMissedBtn"></button>
        <a class="btn" href="./game.html">Play again</a>
        <a class="btn" href="./index.html">Go home</a>
      </div>
    </main>
    <section id="savedResults" class="hidden" aria-labelledby="reviewTitle">
      <div class="review-header">
        <h2 id="reviewTitle" tabindex="-1">Your answers</h2>
        <label class="toggle"><input type="checkbox" id="wrongOnly" /> Wrong answers only</label>
        <button type="button" class="btn" id="backBtn">Back</button>
      </div>
      <div id="results"></div>
    </section>
    <script src="./js/common.js"></script>

  </body>
</html>
