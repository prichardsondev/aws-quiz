name: Deploy aws-quiz to Pi

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Validate question bank
        run: node ../scripts/validate-questions.js services.json

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      PI_HOST: ${{ secrets.PI_HOST }}
      PI_USER: ${{ secrets.PI_USER }}
      PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
      PI_KNOWN_HOSTS: ${{ secrets.PI_KNOWN_HOSTS }}
    steps:
      - name: Verify required secrets exist
        run: |
          for name in PI_HOST PI_USER PI_SSH_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            test -n "${!name}" || { echo "Missing $name secret"; exit 1; }
          done

      - name: Install cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared jammy main" \
            | sudo tee /etc/apt/sources.list.d/cloudflared.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y cloudflared
          cloudflared --version

      - name: Write SSH key and known hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$PI_KNOWN_HOSTS" ]; then
            printf '%s\n' "$PI_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "HOST_KEY_OPTS=-o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::PI_KNOWN_HOSTS secret not set; host key is not verified. Add it to pin the Pi's host key."
            echo "HOST_KEY_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" >> "$GITHUB_ENV"
          fi

      - name: Deploy via Cloudflare Access SSH
        env:
          # cloudflared reads the service token from these instead of the command line.
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              $HOST_KEY_OPTS \
              -o "ProxyCommand=cloudflared access ssh --hostname %h" \
              "${PI_USER}@${PI_HOST}" \
              "/usr/local/bin/aws-quiz-deploy.sh"
